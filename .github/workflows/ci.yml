name: Firmware checks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install declared tools
        run: python -m pip install -r requirements-dev.txt
      - name: Check C++ formatting
        run: python scripts/check_format.py
      - name: Run device-independent behavior tests
        run: pio test -e native
      - name: Build firmware with placeholder configuration
        run: pio run -e nodemcuv2_ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - name: Run browser behavior tests
        run: pnpm test:e2e
